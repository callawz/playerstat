<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFL Torp Predictions - All Players Daily Updates</title>
    <style>
        :root {
            --primary: #d32f2f;
            --accent: #1976d2;
            --success: #4caf50;
            --warning: #ff9800;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 { 
            color: var(--primary); 
            font-size: 2.5em;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .last-updated {
            color: #666;
            font-size: 1.1em;
            margin: 0;
        }
        .team-grid {
            display: grid;
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .team-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        .team-header {
            padding: 20px 25px;
            background: linear-gradient(135deg, var(--accent), #42a5f5);
            color: white;
            font-size: 1.4em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            padding: 25px;
        }
        .player-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .player-card:hover {
            border-color: var(--accent);
            background: white;
            transform: translateY(-2px);
        }
        .torp-pred {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, var(--success), #66bb6a);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9em;
            box-shadow: 0 4px 12px rgba(76,175,80,0.4);
        }
        .player-name {
            font-size: 1.2em;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-position {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            margin-top: 15px;
        }
        .stat-item {
            text-align: center;
            padding: 8px 4px;
            background: white;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 600;
            border: 1px solid #e2e8f0;
        }
        .stat-label { 
            font-size: 0.7em; 
            color: #64748b;
            margin-bottom: 2px;
            font-weight: 500;
        }
        .stat-value { font-size: 1.1em; color: #1e293b; }
        .trend-up { color: var(--success); }
        .trend-down { color: #ef4444; }
        @media (max-width: 768px) {
            .players-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); padding: 20px; }
            h1 { font-size: 2em; }
        }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ AFL Torp Player Predictions</h1>
        <p class="last-updated" id="lastUpdated">Loading predictions... (Last updated: <span id="updateTime"></span>)</p>
    </div>

    <div class="team-grid" id="teamGrid">
        <div class="loading">🔄 Fetching latest Torp predictions from AFL data sources...</div>
    </div>

    <script>
        // AFL Team Data with realistic Torp prediction structure
        const aflTeams = {
            'Adelaide': { emoji: '🐤', players: [] },
            'Brisbane': { emoji: '🦁', players: [] },
            'Carlton': { emoji: '🔵', players: [] },
            'Collingwood': { emoji: '🏴', players: [] },
            'Essendon': { emoji: '⚫', players: [] },
            'Fremantle': { emoji: '🐱', players: [] },
            'Geelong': { emoji: '🐱', players: [] },
            'Gold Coast': { emoji: '☀️', players: [] },
            'GWS': { emoji: '🐯', players: [] },
            'Hawthorn': { emoji: '🦅', players: [] },
            'Melbourne': { emoji: '😈', players: [] },
            'North Melbourne': { emoji: '🐬', players: [] },
            'Port Adelaide': { emoji: '⚫', players: [] },
            'Richmond': { emoji: '🐯', players: [] },
            'St Kilda': { emoji: '❤️', players: [] },
            'Sydney': { emoji: '🔴', players: [] },
            'West Coast': { emoji: '🦅', players: [] },
            'Western Bulldogs': { emoji: '🐶', players: [] }
        };

        // Realistic player data structure (expanded from afltables/matterofstats style)
        const samplePlayers = [
            // Adelaide
            { name: 'Rory Laird', pos: 'MID', torp: 118, avg: 105, disp: 28, tackles: 6.2, trend: 1 },
            { name: 'Izzy Rankine', pos: 'FWD', torp: 95, avg: 87, goals: 2.1, marks: 4.2, trend: 1 },
            { name: 'Jordan Dawson', pos: 'MID', torp: 102, avg: 98, disp: 25, rebound50: 3.1, trend: 0 },
            
            // Brisbane
            { name: 'Lachie Neale', pos: 'MID', torp: 125, avg: 115, disp: 32, cont: 15, trend: 1 },
            { name: 'Hugh McCluggage', pos: 'MID', torp: 108, avg: 102, disp: 27, clrs: 5.2, trend: 1 },
            { name: 'Charlie Cameron', pos: 'FWD', torp: 92, avg: 88, goals: 2.3, shots: 3.1, trend: 0 },
            
            // Add more players for all teams...
            { name: 'Patrick Cripps', team: 'Carlton', pos: 'MID', torp: 122, avg: 118, disp: 30, tackles: 7.1, trend: 1 },
            { name: 'Nick Daicos', team: 'Collingwood', pos: 'MID', torp: 115, avg: 110, disp: 29, cont: 12, trend: 1 },
            // ... (full dataset would continue for all ~800 players)
        ];

        function generateFullPlayerList() {
            // Simulate full AFL squad data (44 players per team x 18 teams = ~792 players)
            Object.keys(aflTeams).forEach(team => {
                for(let i = 0; i < 44; i++) {
                    const baseTorp = 60 + Math.random() * 80;
                    aflTeams[team].players.push({
                        name: `Player ${i+1} (${team})`,
                        pos: ['MID', 'FWD', 'DEF', 'RUC'][Math.floor(Math.random()*4)],
                        torp: Math.round(baseTorp + (Math.random()-0.5)*20),
                        avg: Math.round(baseTorp),
                        disp: Math.round(15 + Math.random()*20),
                        tackles: Math.round(3 + Math.random()*5),
                        trend: Math.random() > 0.5 ? 1 : -1
                    });
                }
            });
            
            // Sort players by Torp prediction within each team
            Object.values(aflTeams).forEach(team => {
                team.players.sort((a, b) => b.torp - a.torp);
            });
        }

        function updateTimestamp() {
            document.getElementById('updateTime').textContent = new Date().toLocaleString('en-AU', {
                timeZone: 'Australia/Melbourne',
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderTeams() {
            const grid = document.getElementById('teamGrid');
            grid.innerHTML = '';
            
            Object.entries(aflTeams).forEach(([teamName, teamData]) => {
                const teamDiv = document.createElement('div');
                teamDiv.className = 'team-card';
                teamDiv.innerHTML = `
                    <div class="team-header">
                        ${teamData.emoji} ${teamName}
                        <span style="margin-left: auto; font-size: 0.9em; opacity: 0.9;">
                            ${teamData.players.length} players
                        </span>
                    </div>
                    <div class="players-grid">
                        ${teamData.players.slice(0, 22).map(player => `
                            <div class="player-card">
                                <div class="torp-pred">Torp: ${player.torp}</div>
                                <div class="player-name">
                                    ${player.name}
                                    <span class="player-position">${player.pos}</span>
                                </div>
                                <div class="stats-grid">
                                    <div class="stat-item">
                                        <div class="stat-label">Season Avg</div>
                                        <div class="stat-value">${player.avg}</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-label">Disposals</div>
                                        <div class="stat-value">${player.disp}</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-label">Trend</div>
                                        <div class="stat-value ${player.trend > 0 ? 'trend-up' : 'trend-down'}">
                                            ${player.trend > 0 ? '↗️' : '↘️'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                grid.appendChild(teamDiv);
            });
        }

        // Auto-refresh every 24 hours (daily updates)
        function refreshData() {
            updateTimestamp();
            // Here you would fetch from:
            // - afltables.com data exports
            // - Squiggle API: https://api.squiggle.com.au/
            // - Torp R package calculations via serverless function
            
            generateFullPlayerList(); // Simulated data - replace with real API
            renderTeams();
            
            document.querySelector('.loading')?.remove();
        }

        // Initial load + daily refresh
        refreshData();
        setInterval(refreshData, 24 * 60 * 60 * 1000); // Once per day
        
        // Cache busting for GitHub Pages
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
